# Publica una versión (Release) de mm12: firmware de las Hellbot Magna 2 con placa MKS Robin Nano V1.2
# (STM32F103), versión recortada. TODO SIN PROBAR.
#
# Cómo se usa:
#   A) Manual: Actions > "Publicar versión Magna 2 placa V1.2" > Run workflow.
#      - "version": nombre de la versión (por ejemplo v1.0). Si queda vacío, se usa la fecha (v2026.11.13-2040).
#      - "borrador": si se marca, la versión queda como borrador para revisarla antes de publicarla.
#   B) Automático: al subir un tag que empiece con "v" (por ejemplo: git tag v1.0 && git push --tags).
#
# Qué publica (en la pestaña Releases del repo):
#   - Magna2-230/300/400/500-placaV12-firmware-UNTESTED-<versión>.zip -> Robin_nano35.bin + assets +
#     instrucciones + LEEME-SIN-PROBAR.txt + PLACA-V12.md (400 y 500 con BLTouch, como los oficiales)
#   - Magna2-perfiles-slicer-<versión>.zip -> perfiles de Cura, PrusaSlicer y OrcaSlicer
#
# Este archivo va en .github/workflows/publicar-release.yml del repo mm12 (junto a compilar-mm12.yml).

name: Publicar versión Magna 2 placa V1.2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nombre de la versión (ej: v1.0). Vacío = fecha y hora'
        required: false
        default: ''
      borrador:
        description: 'Crear como borrador (para revisar antes de publicar)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publicar-release-mm12
  cancel-in-progress: false

jobs:
  # 1) Versión y nombre (lo usan los otros dos trabajos)
  version:
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 y podría romper herramientas
    outputs:
      version: ${{ steps.ver.outputs.version }}
      marlin: ${{ steps.ver.outputs.marlin }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Definir versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          if [ -z "$V" ]; then
            V="v$(TZ=America/Argentina/Buenos_Aires date +%Y.%m.%d-%H%M)"
          fi
          MV=$(tr -d ' \r\n' < MARLIN_VERSION 2>/dev/null || echo "2.1.3-b3")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "marlin=$MV" >> "$GITHUB_OUTPUT"
          echo "Versión: $V  |  Marlin: $MV"

      - name: Verificar que el repo tenga la configuración
        run: |
          if [ ! -f Marlin/Configuration.h ] || [ ! -f platformio.ini ]; then
            echo "::error::Falta Marlin/Configuration.h o platformio.ini. Subí primero mm12.zip y esperá que termine 'Compilar Magna 2 placa V1.2 (mm12.zip)'."
            exit 1
          fi

  # 2) Un firmware por modelo, en paralelo (variantes/armar.sh, lo mismo que el workflow de compilar)
  compilar:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true   # para publicar tienen que salir todos
      matrix:
        modelo: ['230', '300', '400', '500']
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Nombre del paquete
        id: nom
        run: |
          M="${{ matrix.modelo }}"; V="${{ needs.version.outputs.version }}"
          N="Magna2-$M-placaV12-firmware-UNTESTED-$V"   # placa V1.2: todo sin probar
          echo "nombre=$N" >> "$GITHUB_OUTPUT"

      - name: Bajar Marlin y copiar los archivos de la Magna
        run: |
          git clone -q --depth 1 -b "${{ needs.version.outputs.marlin }}" https://github.com/MarlinFirmware/Marlin build
          rm -rf build/.github
          tar cf - --exclude=./.git --exclude=./.github --exclude=./build . | tar xf - -C build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache de PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            build/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'MARLIN_VERSION') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio pillow

      - name: Compilar y armar el paquete
        working-directory: build
        run: |
          bash variantes/armar.sh "${{ matrix.modelo }}" "publicar/${{ steps.nom.outputs.nombre }}" 12
          stat -c%s "publicar/${{ steps.nom.outputs.nombre }}/Robin_nano35.bin" > "publicar/${{ steps.nom.outputs.nombre }}.tam"

      - name: Guardar el paquete para publicar
        uses: actions/upload-artifact@v6
        with:
          name: paquete-${{ matrix.modelo }}
          path: build/publicar
          retention-days: 3

  # 3) Juntar todo y publicar
  publicar:
    needs: [version, compilar]
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Juntar los paquetes
        uses: actions/download-artifact@v7
        with:
          pattern: paquete-*
          path: publicar
          merge-multiple: true

      - name: Armar los zip
        id: paq
        run: |
          V="${{ needs.version.outputs.version }}"
          cd publicar
          for d in Magna2-*-$V; do [ -d "$d" ] && zip -qr "$d.zip" "$d"; done
          cd ..
          zip -qr "publicar/Magna2-perfiles-slicer-$V.zip" perfiles-slicer -x "*/__pycache__/*"
          ls -la publicar

      - name: Notas de la versión
        run: |
          V="${{ needs.version.outputs.version }}"
          cat > publicar/NOTAS.md <<EOF
          ## Hellbot Magna 2 · placa MKS Robin Nano V1.2 · Marlin ${{ needs.version.outputs.marlin }}

          > ⚠️ **SIN PROBAR (UNTESTED).** Ninguno de estos firmware se instaló nunca en una placa V1.2: el autor solo tiene una Magna 2 230 con placa V1.3. Leé \`LEEME-SIN-PROBAR.txt\` y \`PLACA-V12.md\` adentro antes de usarlos.

          Versión **recortada** del firmware de la placa V1.3 (repo mm2): la V1.2 tiene un STM32F103 (72 MHz, 64 KB de RAM) y Marlin con la pantalla MKS ya ocupa casi toda la memoria. Tiene el tema, la pantalla en castellano, la hora chica y todo lo de MagnAir (mensajes, avisos por Telegram, precalentado, calibración); no tiene animaciones, gráfico, "siempre encendida", vista en vivo, cancelar piezas desde la pantalla, resumen al terminar, bloqueo ni input shaping.

          ### Descargas
          | Archivo | Contenido |
          |---|---|
          | \`Magna2-230-placaV12-firmware-UNTESTED-$V.zip\` | Magna 2 230, placa V1.2 |
          | \`Magna2-300-placaV12-firmware-UNTESTED-$V.zip\` | Magna 2 300, placa V1.2 |
          | \`Magna2-400-placaV12-firmware-UNTESTED-$V.zip\` | Magna 2 400 con BLTouch, placa V1.2 |
          | \`Magna2-500-placaV12-firmware-UNTESTED-$V.zip\` | Magna 2 500 con BLTouch, placa V1.2 |
          | \`Magna2-perfiles-slicer-$V.zip\` | Perfiles de Cura, PrusaSlicer y OrcaSlicer |

          ### Instalación
          1. Guardá tu configuración actual con \`M503\` y tené a mano el firmware oficial para volver atrás.
          2. Copiá \`Robin_nano35.bin\` y la carpeta \`assets\` a la raíz de una microSD en FAT32.
          3. Encendé la impresora con la SD puesta y **no la apagues** mientras actualiza.
          4. \`M502\` y luego \`M500\`.
          5. Seguí \`LEEME-SIN-PROBAR.txt\` (sentido de los ejes antes del home, home de a un eje, calentar sin imprimir).

          Compilado desde \`${GITHUB_SHA::7}\`. Más información en el [README](${{ github.server_url }}/${{ github.repository }}#readme).
          EOF
          sed -i 's/^          //' publicar/NOTAS.md
          cat publicar/NOTAS.md

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Magna 2 placa V1.2 · ${{ needs.version.outputs.version }}
          body_path: publicar/NOTAS.md
          draft: ${{ github.event.inputs.borrador == 'true' }}
          files: |
            publicar/*.zip
