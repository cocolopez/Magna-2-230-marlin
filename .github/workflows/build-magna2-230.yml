# Compila Marlin para Hellbot Magna 2 230 (MKS Robin Nano V1.3 + TFT35 v1)
# Resultado: artefacto "Magna2-230-firmware" con Robin_nano35.bin + carpeta assets
name: Compilar firmware Magna 2 230

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'ini/*.ini') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar (mks_robin_nano_v1_3_f4)
        run: pio run -e mks_robin_nano_v1_3_f4

      - name: Preparar paquete para la SD
        run: |
          OUT=dist/Magna2-230
          mkdir -p "$OUT"
          cp .pio/build/mks_robin_nano_v1_3_f4/Robin_nano35.bin "$OUT/"
          if [ -d .pio/build/mks_robin_nano_v1_3_f4/assets ]; then
            cp -r .pio/build/mks_robin_nano_v1_3_f4/assets "$OUT/"
          fi
          cp docs-magna/COMO-FLASHEAR.md "$OUT/" || true
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Magna2-230-firmware
          path: dist/Magna2-230
