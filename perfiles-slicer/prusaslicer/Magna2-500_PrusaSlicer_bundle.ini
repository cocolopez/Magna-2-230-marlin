# Bundle PrusaSlicer - Hellbot Magna 2 500 (Marlin 2.1) - SIN PROBAR en una maquina real
# Importar: Archivo > Importar > Importar paquete de configuracion (Import Config Bundle)

[printer:Magna 2 500 Marlin 2.1]
printer_technology = FFF
printer_model = 
bed_shape = 0x0,500x0,500x500,0x500
max_print_height = 500
gcode_flavor = marlin2
use_relative_e_distances = 0
nozzle_diameter = 0.4,0.4
extruder_offset = 0x0,0x0
extruder_colour = #FF8000;#2080FF
single_extruder_multi_material = 1
cooling_tube_length = 10
cooling_tube_retraction = 20
parking_pos_retraction = 100
extra_loading_move = -2
single_extruder_multi_material_priming = 0
high_current_on_filament_swap = 0
retract_length = 5.0,5.0
retract_speed = 25,25
deretract_speed = 0,0
retract_lift = 0.2,0.2
retract_lift_below = 499,499
retract_length_toolchange = 0,0
retract_restart_extra_toolchange = 0,0
wipe = 0,0
machine_limits_usage = emit_to_gcode
machine_max_feedrate_x = 100
machine_max_feedrate_y = 100
machine_max_feedrate_z = 5
machine_max_feedrate_e = 25
machine_max_acceleration_x = 200
machine_max_acceleration_y = 200
machine_max_acceleration_z = 100
machine_max_acceleration_e = 8000
machine_max_acceleration_extruding = 200
machine_max_acceleration_retracting = 200
machine_max_acceleration_travel = 200
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_z = 0.3
machine_max_jerk_e = 5
remaining_times = 1
start_gcode = ; --- Magna 2 500 inicio ---\n; Antes de imprimir: los dos filamentos estacionados (asi quedan al terminar cada impresion).\n; Si cargaste filamento a mano hasta la boquilla, corre gcode-utiles/estacionar_T0.gcode o _T1.\nM217 S0 ; el cambio 2 en 1 lo hace el slicer, no el firmware\nG90 ; absoluto\nM82 ; extrusor absoluto\nM140 S[first_layer_bed_temperature[initial_tool]] ; cama\nM104 S[first_layer_temperature[initial_tool]] ; hotend (sin esperar)\nG28 ; home\nM190 S[first_layer_bed_temperature[initial_tool]]\nM109 S[first_layer_temperature[initial_tool]]\nG92 E0\nG1 Z5 F600\n; --- fin inicio ---\nT[initial_tool]\n; carga el primer filamento desde la posicion de estacionado y purga\nG92 E0\nG1 E100 F1500\nG92 E0\nG1 X5 Y20 Z0.3 F5000\nG1 X5 Y200 Z0.3 F1500 E15 ; linea de purga\nG1 X5.4 Y200 Z0.3 F5000\nG1 X5.4 Y20 Z0.3 F1500 E30 ; segunda linea\nG92 E0\nG1 Z2.0 F600
end_gcode = ; estaciona el ultimo filamento arriba de la union 2 en 1\nG92 E0\nG1 E-100 F1500\nG92 E0\n; --- Magna 2 500 fin ---\nG91 ; relativo\nG1 Z10 F600 ; subir\nG90\nG1 X0 Y490 F3000 ; presentar la pieza\nM106 S0 ; ventilador off\nM104 S0 ; hotend off\nM140 S0 ; cama off\nM84 X Y E ; motores off (Z queda trabado)\n; --- fin ---
toolchange_gcode = T[next_extruder] ; la torre de purga descarga/carga el filamento (2 en 1)

