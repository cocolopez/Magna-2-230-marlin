# Compila el firmware Marlin de la Hellbot Magna 2 230 a partir de mm2.zip
#
# Uso:
#   1. Subí mm2.zip a la raíz del repo (Add file > Upload files, o git push).
#   2. Este workflow lo descomprime en el repo, guarda los archivos (commit) y borra mm2.zip.
#   3. Compila con PlatformIO (mks_robin_nano_v1_3_f4).
#   4. Descargá el artefacto "Magna2-230-firmware" (Robin_nano35.bin + assets) desde la pestaña Actions.
#
# También se puede correr a mano: Actions > Compilar Magna 2 230 (mm2.zip) > Run workflow
# (si no hay mm2.zip, compila lo que ya esté en el repo).

name: Compilar Magna 2 230 (mm2.zip)

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-mm2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Extraer mm2.zip en el repo
        id: extraer
        run: |
          if [ ! -f mm2.zip ]; then
            echo "No hay mm2.zip: se compila lo que ya está en el repo."
            echo "extraido=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TMP=$(mktemp -d)
          unzip -q mm2.zip -d "$TMP"
          # Si el zip trae una sola carpeta arriba de todo, usar su contenido
          SRC="$TMP"
          if [ "$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find "$TMP" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$TMP" -mindepth 1 -maxdepth 1)"
          fi
          if [ ! -f "$SRC/platformio.ini" ] || [ ! -d "$SRC/Marlin" ]; then
            echo "::error::mm2.zip no tiene platformio.ini y la carpeta Marlin en la raíz."
            exit 1
          fi
          command -v rsync >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q rsync; }
          # Copiar al repo (borra lo que ya no esté en el zip; nunca toca .git ni .github)
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'mm2.zip' \
            "$SRC"/ ./
          rm -f mm2.zip
          echo "extraido=si" >> "$GITHUB_OUTPUT"

      - name: Guardar los archivos extraídos en el repo
        if: steps.extraer.outputs.extraido == 'si'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -q -m "Extraer mm2.zip [skip ci]"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'ini/*.ini') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Chequeos rápidos de configuración
        run: |
          [ -f pruebas/sanity-check.sh ] && bash pruebas/sanity-check.sh || true
          [ -f pruebas/verificar-valores.sh ] && bash pruebas/verificar-valores.sh || true

      - name: Compilar (mks_robin_nano_v1_3_f4)
        run: pio run -e mks_robin_nano_v1_3_f4

      - name: Preparar archivos para la SD
        run: |
          OUT=dist/Magna2-230
          mkdir -p "$OUT"
          cp .pio/build/mks_robin_nano_v1_3_f4/Robin_nano35.bin "$OUT/"
          if [ -d .pio/build/mks_robin_nano_v1_3_f4/assets ]; then
            cp -r .pio/build/mks_robin_nano_v1_3_f4/assets "$OUT/"
          fi
          [ -f docs-magna/COMO-FLASHEAR.md ] && cp docs-magna/COMO-FLASHEAR.md "$OUT/"
          ls -la "$OUT"
          echo "### Firmware compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "Robin_nano35.bin: $(stat -c%s "$OUT/Robin_nano35.bin") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Magna2-230-firmware
          path: dist/Magna2-230
