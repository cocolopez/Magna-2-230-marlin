# Publica una versión (Release) del firmware de las Hellbot Magna 2 en GitHub.
#
# Cómo se usa:
#   A) Manual: Actions > "Publicar versión Magna 2" > Run workflow.
#      - "version": nombre de la versión (por ejemplo v1.0). Si queda vacío, se usa la fecha (v2026.11.13-2040).
#      - "borrador": si se marca, la versión queda como borrador para revisarla antes de publicarla.
#   B) Automático: al subir un tag que empiece con "v" (por ejemplo: git tag v1.0 && git push --tags).
#
# Qué publica (en la pestaña Releases del repo):
#   - Magna2-230-firmware-<versión>.zip  -> Robin_nano35.bin + assets + opcional-wifi + COMO-FLASHEAR.md
#   - Magna2-230-firmware-BLTouch-<versión>.zip -> lo mismo, compilado para BLTouch (+ BLTOUCH.md)
#   - Magna2-300/400/400D/500/500D-firmware-UNTESTED-<versión>.zip -> otros modelos, SIN PROBAR
#     (+ LEEME-SIN-PROBAR.txt y MODELOS.md)
#   - Magna2-perfiles-slicer-<versión>.zip -> perfiles de Cura, PrusaSlicer y OrcaSlicer (todos los modelos)
#   - Robin_nano35.bin suelto (230 sin BLTouch)
#
# Este archivo va en .github/workflows/publicar-release.yml (junto a compilar-mm2.yml).

name: Publicar versión Magna 2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nombre de la versión (ej: v1.0). Vacío = fecha y hora'
        required: false
        default: ''
      borrador:
        description: 'Crear como borrador (para revisar antes de publicar)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publicar-release
  cancel-in-progress: false

jobs:
  # 1) Versión y nombre (lo usan los otros dos trabajos)
  version:
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 y podría romper herramientas
    outputs:
      version: ${{ steps.ver.outputs.version }}
      marlin: ${{ steps.ver.outputs.marlin }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Definir versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          if [ -z "$V" ]; then
            V="v$(TZ=America/Argentina/Buenos_Aires date +%Y.%m.%d-%H%M)"
          fi
          MV=$(tr -d ' \r\n' < MARLIN_VERSION 2>/dev/null || echo "2.1.3-b3")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "marlin=$MV" >> "$GITHUB_OUTPUT"
          echo "Versión: $V  |  Marlin: $MV"

      - name: Verificar que el repo tenga la configuración
        run: |
          if [ ! -f Marlin/Configuration.h ] || [ ! -f platformio.ini ]; then
            echo "::error::Falta Marlin/Configuration.h o platformio.ini. Subí primero mm2.zip y esperá que termine 'Compilar Magna 2 (mm2.zip)'."
            exit 1
          fi

  # 2) Un firmware por modelo, en paralelo (variantes/armar.sh, lo mismo que el workflow de compilar)
  compilar:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true   # para publicar tienen que salir todos
      matrix:
        modelo: ['230', '230-BLTouch', '300', '400', '400D', '500', '500D']
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Nombre del paquete
        id: nom
        run: |
          M="${{ matrix.modelo }}"; V="${{ needs.version.outputs.version }}"
          case "$M" in
            230) N="Magna2-230-firmware-$V" ;;
            230-BLTouch) N="Magna2-230-firmware-BLTouch-$V" ;;
            *) N="Magna2-$M-firmware-UNTESTED-$V" ;;   # sin probar en una máquina real
          esac
          echo "nombre=$N" >> "$GITHUB_OUTPUT"

      - name: Bajar Marlin y copiar los archivos de la Magna
        run: |
          git clone -q --depth 1 -b "${{ needs.version.outputs.marlin }}" https://github.com/MarlinFirmware/Marlin build
          rm -rf build/.github
          tar cf - --exclude=./.git --exclude=./.github --exclude=./build . | tar xf - -C build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache de PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            build/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'MARLIN_VERSION') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio pillow

      - name: Compilar y armar el paquete
        working-directory: build
        run: |
          bash variantes/armar.sh "${{ matrix.modelo }}" "publicar/${{ steps.nom.outputs.nombre }}"
          stat -c%s "publicar/${{ steps.nom.outputs.nombre }}/Robin_nano35.bin" > "publicar/${{ steps.nom.outputs.nombre }}.tam"

      - name: Guardar el paquete para publicar
        uses: actions/upload-artifact@v6
        with:
          name: paquete-${{ matrix.modelo }}
          path: build/publicar
          retention-days: 3

  # 3) Juntar todo y publicar
  publicar:
    needs: [version, compilar]
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v6

      - name: Juntar los paquetes
        uses: actions/download-artifact@v7
        with:
          pattern: paquete-*
          path: publicar
          merge-multiple: true

      - name: Armar los zip
        id: paq
        run: |
          V="${{ needs.version.outputs.version }}"
          cd publicar
          for d in Magna2-*-$V; do [ -d "$d" ] && zip -qr "$d.zip" "$d"; done
          cd ..
          zip -qr "publicar/Magna2-perfiles-slicer-$V.zip" perfiles-slicer -x "*/__pycache__/*"
          cp "publicar/Magna2-230-firmware-$V/Robin_nano35.bin" publicar/Robin_nano35.bin
          echo "tam=$(cat "publicar/Magna2-230-firmware-$V.tam")" >> "$GITHUB_OUTPUT"
          ls -la publicar

      - name: Notas de la versión
        run: |
          V="${{ needs.version.outputs.version }}"
          cat > publicar/NOTAS.md <<EOF
          ## Hellbot Magna 2 · Marlin ${{ needs.version.outputs.marlin }}

          Firmware para **MKS Robin Nano V1.3** (STM32F407) con pantalla **MKS TFT35**, tema propio negro y rojo, pantalla en castellano.

          > ⚠️ **Solo la Magna 2 230 está probada.** Los paquetes de 300, 400, 400D, 500 y 500D dicen **UNTESTED**: están armados con los valores de los firmware oficiales de Hellbot, pero nadie los instaló todavía en una máquina real. Leé \`LEEME-SIN-PROBAR.txt\` adentro antes de usarlos.

          ### Descargas
          | Archivo | Contenido |
          |---|---|
          | \`Magna2-230-firmware-$V.zip\` | Magna 2 230: \`Robin_nano35.bin\` + carpeta \`assets\` + \`opcional-wifi/\` + instrucciones |
          | \`Magna2-230-firmware-BLTouch-$V.zip\` | Lo mismo, para la 230 con **BLTouch** (nivelación automática). Ver \`BLTOUCH.md\` adentro |
          | \`Magna2-300-firmware-UNTESTED-$V.zip\` | Magna 2 300 · **sin probar** |
          | \`Magna2-400-firmware-UNTESTED-$V.zip\` / \`Magna2-400D-…\` | Magna 2 400 (bowden) / 400D (directa), con BLTouch · **sin probar** |
          | \`Magna2-500-firmware-UNTESTED-$V.zip\` / \`Magna2-500D-…\` | Magna 2 500 (bowden) / 500D (directa), con BLTouch · **sin probar** |
          | \`Magna2-perfiles-slicer-$V.zip\` | Perfiles de Cura, PrusaSlicer y OrcaSlicer para todos los modelos |
          | \`Robin_nano35.bin\` | Solo el firmware de la 230 sin BLTouch (sin íconos) |

          ### Instalación
          1. Guardá tu configuración actual con \`M503\`.
          2. Copiá \`Robin_nano35.bin\` y la carpeta \`assets\` a la raíz de una microSD en FAT32 (y \`opcional-wifi/MksWifi.bin\` si querés actualizar el WiFi). Si en la SD quedó una carpeta \`_assets\` vieja, podés borrarla.
          3. Encendé la impresora con la SD puesta y **no la apagues** mientras actualiza.
          4. Cargá la configuración nueva: \`M502\` y luego \`M500\`.
          5. Si la pantalla sigue en inglés: Ajustes → Idioma → Español (queda guardado el idioma que tenías).
          6. Calibrá con los botones de **Ajustes → Más** (Calib. hotend y Calib. cama), y después \`M900\` y \`M593\` (ver CALIBRACION.md).

          ### Incluye
          Doble extrusor con hotend 2 en 1 · BLTouch (230 opcional, 400 y 500) · Input Shaping · MPC · Linear Advance · S-Curve · 2 sensores de filamento · pausa/M600 · recuperación ante cortes de luz · apagado por inactividad · cancelar objetos (M486) · tiempo restante (M73) · WiFi MKS (MagnAir).

          Firmware 230: $(( ${{ steps.paq.outputs.tam }} / 1024 )) KB · Compilado desde \`${GITHUB_SHA::7}\`.
          Más información en el [README](${{ github.server_url }}/${{ github.repository }}#readme).
          EOF
          sed -i 's/^          //' publicar/NOTAS.md
          cat publicar/NOTAS.md

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Magna 2 · ${{ needs.version.outputs.version }}
          body_path: publicar/NOTAS.md
          draft: ${{ github.event.inputs.borrador == 'true' }}
          files: |
            publicar/*.zip
            publicar/Robin_nano35.bin
